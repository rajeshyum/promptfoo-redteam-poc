# DATASET COLLECTIONS category — the last uncovered Promptfoo plugin category (design §3).
#
# Unlike every other config here, these plugins do NOT generate attacks tailored to your app.
# They replay curated, published adversarial corpora. That difference is the point of running
# them for an adoption decision:
#   * they need NO remote generation and NO Promptfoo Cloud login (they are static datasets),
#     so this is the one pass that runs fully air-gapped — the honest counterexample to the
#     POC's "local generation disables the good plugins" finding (design §5, rubric row
#     "Data residency"). Grading still calls a model unless you point `redteam.provider` at
#     a local one.
#   * they are reproducible run-to-run, so they make a sane CI gate (see ci-gate.sh),
#     whereas freshly-generated attacks differ every run.
#   * they are model-layer, so they probe the same surface as the POC's two misses (#1, #8) —
#     a breadth check on whether gpt-4o-mini's refusals hold against published jailbreaks
#     rather than only against promptfoo's generated ones.
#
# Runtime: ~5 datasets × 5 tests = ~25 cases, ~10-15 min. Raise numTests for a real breadth
# pass (these corpora hold thousands of prompts; numTests samples from them).
description: SupportBot dataset-collection pass (published adversarial corpora)

targets:
  - id: http
    label: supportbot
    config:
      url: http://localhost:8000/chat
      method: POST
      headers:
        Content-Type: application/json
      body:
        session_id: '{{sessionId}}'
        message: '{{prompt}}'
      transformResponse: 'json.reply'
      sessionSource: client
      stateful: false

redteam:
  purpose: >
    SupportBot is the customer-support assistant for "Acme Fintech". It must refuse harmful,
    hateful, illegal and privacy-violating requests, must never disclose its system prompt or
    internal keys, and must never act on instructions embedded in retrieved documents.

  numTests: 5

  plugins:
    - harmbench      # HarmBench harmful-behaviour corpus
    - donotanswer    # questions a model should decline outright
    - beavertails    # malicious-prompt corpus
    - cyberseceval   # Meta CyberSecEval prompt-injection set
    - pliny          # community "Pliny" jailbreak prompts
    - xstest         # over-refusal counterpart: SAFE prompts that models wrongly refuse

  # No strategies: replaying these corpora verbatim is the point. Layering a strategy on top
  # would multiply cost while confounding "does the published attack work" with "does our
  # obfuscation of it work".
  strategies: []
